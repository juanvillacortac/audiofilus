# The Android app (audiofilus.apk), signed with the release key from the
# repository secrets (see docs/android.md). Run by hand from the Actions tab
# ("Run workflow"); releases build it too (release.yml).
name: Android

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      LASTFM_KEY:
        required: false
      LASTFM_SECRET:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts

      # The runner's SDK (ANDROID_HOME) and its newest preinstalled NDK; the
      # platform is only downloaded if the image doesn't have it (downloading
      # an NDK took six minutes).
      - name: NDK and platform
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:?no preinstalled NDK}" >> "$GITHUB_ENV"
          [ -d "$ANDROID_HOME/platforms/android-36" ] ||
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" >/dev/null

      - name: The C decoders (android/libs.sh)
        run: android/libs.sh

      - name: The app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AUDIOFILUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUDIOFILUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUDIOFILUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          # The app's version is the tag's (v0.15.0 -> 0.15.0).
          [ "$GITHUB_REF_TYPE" = tag ] && export VERSION=${GITHUB_REF_NAME#v}
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export AUDIOFILUS_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          # The GitHub one, which updates itself (Settings → Update).
          android/build.sh release github
          cp android/app/build/outputs/apk/github/release/app-github-release.apk audiofilus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: audiofilus-android
          path: audiofilus.apk
          retention-days: 14
