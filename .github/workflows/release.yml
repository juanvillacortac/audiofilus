# When a vX.Y.Z tag is pushed, builds with the Dockerfile and publishes a
# release with the PortMaster port, the Linux and Windows binaries and the
# unsigned iOS app (built on macOS by ios.yml, at the same time).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    uses: ./.github/workflows/ios.yml

  release:
    needs: ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zig, for libgme and libvgm
        uses: jdx/mise-action@v2
        with:
          mise_toml: |
            [tools]
            zig = "0.15.2"
      - name: libgme for the handhelds (tools/libgme/build.sh)
        run: tools/libgme/build.sh build/libgme
      - name: libvgm for the handhelds and Linux (tools/libvgm/build.sh)
        run: tools/libvgm/build.sh build/libvgm
      - name: Build in the container
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: docker build --build-arg LASTFM_KEY --build-arg LASTFM_SECRET --build-arg VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }} --target dist --output dist .
      - name: Package
        run: |
          mkdir -p out
          cp dist/audiofilus.zip out/audiofilus-portmaster.zip
          cp dist/audiofilus.muxapp out/audiofilus.muxapp
          for arch in amd64 arm64; do
            d=audiofilus-linux-$arch
            mkdir -p "$d/licenses"
            cp "dist/audiofilus-$arch" "$d/audiofilus"
            cp LICENSE internal/ui/assets/fonts/OFL-*.txt "$d/licenses/"
            libs=libs.aarch64
            [ "$arch" = amd64 ] && libs=libs.x86_64
            cp -r "build/libgme/$libs" "$d/"
            cp build/libgme/libgme-*.txt "$d/licenses/"
            cp "build/libvgm/$libs/libvgmshim.so" "$d/$libs/"
            cp build/libvgm/libvgm-*.txt "$d/licenses/"
            cp tools/libvgm/GPL-2.0.txt "$d/licenses/libvgm-GPL-2.0.txt"
            tar -czf "out/$d.tar.gz" "$d"
          done
          d=audiofilus-windows-amd64
          mkdir -p "$d/licenses"
          cp dist/audiofilus-windows-amd64.exe "$d/audiofilus.exe"
          cp LICENSE internal/ui/assets/fonts/OFL-*.txt "$d/licenses/"
          (cd "$d" && zip -qr "../out/$d.zip" .)
      - name: The iOS app
        uses: actions/download-artifact@v4
        with:
          name: audiofilus-ios
          path: out
      - name: Checksums
        run: (cd out && sha256sum * > SHA256SUMS)
      - name: Upload the files
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "audiofilus $GITHUB_REF_NAME" --generate-notes
      - name: Keep the files (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: audiofilus
          path: out/
