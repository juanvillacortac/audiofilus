# When a vX.Y.Z tag is pushed, builds with the Dockerfile and publishes a
# release with the PortMaster port, the Linux and Windows binaries and the
# unsigned iOS app (built on macOS by ios.yml, at the same time).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    uses: ./.github/workflows/ios.yml

  release:
    needs: ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in the container
        run: docker build --target dist --output dist .
      - name: Package
        run: |
          mkdir -p out
          cp dist/audiofilus.zip out/audiofilus-portmaster.zip
          for arch in amd64 arm64; do
            d=audiofilus-linux-$arch
            mkdir -p "$d/licenses"
            cp "dist/audiofilus-$arch" "$d/audiofilus"
            cp LICENSE internal/ui/assets/fonts/OFL-*.txt "$d/licenses/"
            tar -czf "out/$d.tar.gz" "$d"
          done
          d=audiofilus-windows-amd64
          mkdir -p "$d/licenses"
          cp dist/audiofilus-windows-amd64.exe "$d/audiofilus.exe"
          cp LICENSE internal/ui/assets/fonts/OFL-*.txt "$d/licenses/"
          (cd "$d" && zip -qr "../out/$d.zip" .)
      - name: The iOS app
        uses: actions/download-artifact@v4
        with:
          name: audiofilus-ios
          path: out
      - name: Checksums
        run: (cd out && sha256sum * > SHA256SUMS)
      - name: Upload the files
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "audiofilus $GITHUB_REF_NAME" --generate-notes
      - name: Keep the files (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: audiofilus
          path: out/
