# Publishes the website in site/ to GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", "tools/site/altstore.py"]
  # The AltStore source lists the releases: rebuilt when one is made (the
  # Release workflow). Not on the `release` event: that run is on the tag, and
  # the github-pages environment only deploys from main. After editing a
  # release's notes, run this workflow by hand (workflow_dispatch).
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Queued, not cancelled: a site push must not drop the post-release rebuild.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The AltStore / SideStore source (altstore.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/site/altstore.py site/altstore.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
