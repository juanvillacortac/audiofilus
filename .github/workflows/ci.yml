# Checks every push and pull request: formatting, vet, tests, and that the
# handheld build works without cgo.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "**.md"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Headers for the desktop UI (GLFW)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build for arm64 without cgo
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/audiofilus

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        shell: bash
        run: |
          go build -ldflags=-H=windowsgui -o bin/audiofilus.exe ./cmd/audiofilus
      - name: Virtual sound card (the runner has none)
        uses: LABSN/sound-ci-helpers@v1
      - name: Smoke test (service, socket, playback, quit)
        shell: bash
        run: |
          set -x
          trap 'cat bin/data/audiofilus.log || true' EXIT
          ./bin/audiofilus.exe daemon -detach
          ./bin/audiofilus.exe status
          ./bin/audiofilus.exe play internal/decode/testdata
          sleep 2
          ./bin/audiofilus.exe status
          ./bin/audiofilus.exe quit

  # Las DLL que lleva el zip de Windows (tools/windows/dlls.sh), probadas en
  # Windows: tienen que cargar y decodificar MP3, AAC y Opus.
  windows-dlls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zig, for fdk-aac
        uses: jdx/mise-action@v2
        with:
          mise_toml: |
            [tools]
            zig = "0.15.2"
      - run: tools/windows/dlls.sh build/windows-dlls
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dlls
          path: build/windows-dlls/

  windows-native:
    needs: windows-dlls
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: windows-dlls
          path: dlls
      - name: Decode with the bundled DLLs
        shell: bash
        run: |
          export PATH="$PWD/dlls:$PATH" AUDIOFILUS_REQUIRE_NATIVE=1
          go test -run 'RequireNative' -v ./internal/decode
