# The macOS apps, Apple Silicon and Intel, as one DMG each (tools/macos/dmg.sh),
# ad-hoc signed. Run by hand from the Actions tab, on pull requests, and from
# release.yml.
name: macOS

on:
  workflow_dispatch:
  pull_request:
  workflow_call:
    secrets:
      LASTFM_KEY:
        required: false
      LASTFM_SECRET:
        required: false

jobs:
  dmg:
    # Both from one Intel Mac: zig builds the decoders for both
    # (tools/macos/libs.sh). The arm64 runners often wait 15 minutes and get
    # cancelled.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: zig, for the decoders
        uses: jdx/mise-action@v2
        with:
          mise_toml: |
            [tools]
            zig = "0.15.2"
      - name: The decoders (tools/macos/libs.sh)
        run: tools/macos/libs.sh build/macos
      - name: The DMGs
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && export VERSION=$GITHUB_REF_NAME
          tools/macos/dmg.sh out
      - name: Signed, for the right CPU, only the system's libraries, and the Intel one starts
        run: |
          for arch in arm64 amd64; do
            mnt=/tmp/af-$arch
            hdiutil attach out/Audiofilus-macos-$arch.dmg -mountpoint $mnt -nobrowse
            codesign --verify --deep $mnt/Audiofilus.app
            want=$([ $arch = arm64 ] && echo arm64 || echo x86_64)
            for f in $mnt/Audiofilus.app/Contents/MacOS/audiofilus $mnt/Audiofilus.app/Contents/Frameworks/*.dylib; do
              file -b "$f" | grep -q "$want" || { echo "$f is not $want"; exit 1; }
            done
            if otool -L $mnt/Audiofilus.app/Contents/Frameworks/*.dylib | grep -v -E '^/|@rpath|/usr/lib/lib(System.B|iconv.2)'; then exit 1; fi
          done
          /tmp/af-amd64/Audiofilus.app/Contents/MacOS/audiofilus version
          /tmp/af-amd64/Audiofilus.app/Contents/MacOS/audiofilus bench "$PWD/internal/decode/testdata/tone.m4a"
          hdiutil detach /tmp/af-arm64
          hdiutil detach /tmp/af-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: audiofilus-macos
          path: out/*.dmg
          retention-days: 14
